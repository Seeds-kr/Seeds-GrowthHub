openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: >-
    Seeds API — 인증 · 지원 · 모집/평가 표면의 계약.

    이 스펙은 서버의 전부가 아니다(19경로 / 실제 200+). 그것은 미완이 아니라
    경계다: 여기 있는 것은 화면 여러 곳이 공유하고 응답 모양이 굳은 표면
    — 세션(`/admin/me`·login·logout), 공개 지원서 제출, 모집·평가 —
    이고, orval 이 생성한 훅(`useAdminMe` 등)을 레이아웃 다섯 개가 함께 쓴다.

    그 밖의 표면(MVP3 운영 · MVP4 성장 · 회의록 · 스터디 · 발송이력 …)은
    손으로 쓴 `api()` 헬퍼를 쓴다. 화면 하나가 쓰는 엔드포인트가 대부분이고
    아직 모양이 자주 바뀌는 자리라, 스펙을 먼저 고치고 코드를 생성하는 왕복이
    이득보다 비싸다.

    **넓힐 때의 기준**: 엔드포인트가 (1) 화면 두 곳 이상에서 쓰이고
    (2) 응답 모양이 굳었으면 여기로 옮긴다. 그 전에는 옮기지 않는다 —
    스펙이 코드를 못 따라오면 계약이 아니라 낡은 문서가 된다.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: applications
  - name: admin
  - name: evaluator
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /applications:
    post:
      operationId: createApplication
      tags: [applications]
      summary: Submit a new application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApplicationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Current session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/applications:
    get:
      operationId: listApplications
      tags: [admin]
      summary: List applications (admin)
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
        - in: query
          name: applicationStatus
          schema:
            $ref: "#/components/schemas/ApplicationLifecycleStatus"
        - in: query
          name: finalDecision
          schema:
            $ref: "#/components/schemas/FinalDecision"
        - in: query
          name: evaluationCompletion
          schema:
            type: string
            enum: [any, none, partial, complete]
        - in: query
          name: interviewStatus
          schema:
            $ref: "#/components/schemas/InterviewStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/applications/stats:
    get:
      operationId: applicationStats
      tags: [admin]
      summary: Application stats by status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStats"

  /admin/dashboard:
    get:
      operationId: adminDashboard
      tags: [admin]
      summary: Aggregated stats for the admin dashboard
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /admin/applications/{id}:
    get:
      operationId: getApplication
      tags: [admin]
      summary: Get application detail (admin) — includes assignments, evaluations, interview, decision logs
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateApplication
      tags: [admin]
      summary: Update application status / admin note (legacy MVP1)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/applications/export:
    get:
      operationId: exportApplicationsCsv
      tags: [admin]
      summary: Export applications as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List users (evaluators + admins)
      parameters:
        - in: query
          name: role
          schema:
            $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a user (typically an evaluator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}:
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Update a user (name/email/isActive/password)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/applications/{id}/assignments:
    post:
      operationId: createAssignment
      tags: [admin]
      summary: Assign an evaluator to an application
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationAssignment"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/applications/{appId}/assignments/{assignmentId}:
    delete:
      operationId: deleteAssignment
      tags: [admin]
      summary: Remove an evaluator assignment
      parameters:
        - in: path
          name: appId
          required: true
          schema: { type: integer }
        - in: path
          name: assignmentId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/applications/{id}/interview:
    put:
      operationId: upsertInterview
      tags: [admin]
      summary: Create or update interview details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertInterviewBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interview"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/applications/{id}/final-decision:
    patch:
      operationId: setFinalDecision
      tags: [admin]
      summary: Set final decision for an application (and append a decision log)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFinalDecisionBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /evaluator/assignments:
    get:
      operationId: listMyAssignments
      tags: [evaluator]
      summary: List the current evaluator's assignments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluatorAssignmentList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /evaluator/applications/{id}:
    get:
      operationId: getEvaluatorApplication
      tags: [evaluator]
      summary: Get an application the current evaluator is assigned to (with own evaluation only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluatorApplicationDetail"
        "403":
          description: Not assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /evaluator/applications/{id}/evaluations:
    post:
      operationId: submitEvaluation
      tags: [evaluator]
      summary: Submit or update the current evaluator's evaluation for the given stage
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEvaluationBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evaluation"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    OkResponse:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    UserRole:
      type: string
      enum: [admin, mentor, student]

    # Functional ops roles (ADR-002). Orthogonal to UserRole: UserRole says which
    # workspace an account may enter, OpsRole says what it may do inside /admin.
    # program_lead is a superuser.
    OpsRole:
      type: string
      enum: [program_lead, ops, recruiting, finance, growth, community, system]

    ApplicationStatus:
      type: string
      enum:
        - submitted
        - reviewing
        - interview
        - accepted
        - rejected
        - waitlisted
        - withdrawn

    ApplicationLifecycleStatus:
      type: string
      enum:
        - submitted
        - document_review
        - document_review_completed
        - interview
        - interview_scheduled
        - interview_completed
        - final_decision_made
        - withdrawn

    FinalDecision:
      type: string
      enum: [pending, accepted, rejected, waitlisted, withdrawn]

    EvaluationStage:
      type: string
      enum: [document_review, interview]

    AssignmentStatus:
      type: string
      enum: [assigned, in_progress, completed]

    InterviewStatus:
      type: string
      enum: [not_scheduled, scheduled, completed, no_show, cancelled]

    Recommendation:
      type: string
      enum: [strong_accept, accept, hold, reject, strong_reject]

    CreateApplicationBody:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 200 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        school: { type: string, minLength: 1, maxLength: 200 }
        grade: { type: string, minLength: 1, maxLength: 50 }
        birthYear: { type: integer, minimum: 1950, maximum: 2025 }
        interestArea: { type: string, minLength: 1, maxLength: 100 }
        motivation: { type: string, minLength: 1, maxLength: 5000 }
        experience: { type: string, minLength: 1, maxLength: 5000 }
        problemAwareness: { type: string, minLength: 1, maxLength: 5000 }
        expectation: { type: string, minLength: 1, maxLength: 5000 }
        privacyConsent:
          type: boolean
          enum: [true]
      required:
        - name
        - email
        - phone
        - school
        - grade
        - birthYear
        - interestArea
        - motivation
        - experience
        - problemAwareness
        - expectation
        - privacyConsent

    CreateApplicationResponse:
      type: object
      properties:
        id: { type: integer }
      required: [id]

    Application:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        school: { type: string }
        grade: { type: string }
        birthYear: { type: integer }
        interestArea: { type: string }
        motivation: { type: string }
        experience: { type: string }
        problemAwareness: { type: string }
        expectation: { type: string }
        privacyConsent: { type: boolean }
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        applicationStatus:
          $ref: "#/components/schemas/ApplicationLifecycleStatus"
        finalDecision:
          $ref: "#/components/schemas/FinalDecision"
        adminNote:
          type: string
          nullable: true
        submittedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - name
        - email
        - phone
        - school
        - grade
        - birthYear
        - interestArea
        - motivation
        - experience
        - problemAwareness
        - expectation
        - privacyConsent
        - status
        - applicationStatus
        - finalDecision
        - adminNote
        - submittedAt
        - updatedAt

    ApplicationListItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        school: { type: string }
        grade: { type: string }
        interestArea: { type: string }
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        applicationStatus:
          $ref: "#/components/schemas/ApplicationLifecycleStatus"
        finalDecision:
          $ref: "#/components/schemas/FinalDecision"
        avgDocReviewScore:
          type: number
          nullable: true
        evaluationsAssigned: { type: integer }
        evaluationsCompleted: { type: integer }
        interviewStatus:
          $ref: "#/components/schemas/InterviewStatus"
        submittedAt: { type: string, format: date-time }
      required:
        - id
        - name
        - email
        - school
        - grade
        - interestArea
        - status
        - applicationStatus
        - finalDecision
        - avgDocReviewScore
        - evaluationsAssigned
        - evaluationsCompleted
        - interviewStatus
        - submittedAt

    ApplicationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationListItem"
        total: { type: integer }
      required: [items, total]

    ApplicationStatusCount:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        count: { type: integer }
      required: [status, count]

    ApplicationStats:
      type: object
      properties:
        total: { type: integer }
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationStatusCount"
      required: [total, byStatus]

    DashboardCohortItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        studentCount: { type: integer }
      required: [id, name, status, startDate, endDate, studentCount]

    DashboardSessionItem:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        scheduledAt: { type: string, format: date-time }
        sessionType: { type: string }
        status: { type: string }
        cohortName: { type: string, nullable: true }
        programName: { type: string, nullable: true }
      required: [id, title, scheduledAt, sessionType, status, cohortName, programName]

    DashboardAssignmentItem:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        dueAt: { type: string, format: date-time, nullable: true }
        cohortName: { type: string, nullable: true }
        submissions: { type: integer }
        totalStudents: { type: integer }
      required: [id, title, dueAt, cohortName, submissions, totalStudents]

    DashboardAnnouncementItem:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        targetType: { type: string }
        publishedAt: { type: string, format: date-time, nullable: true }
      required: [id, title, targetType, publishedAt]

    AdminDashboard:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        applications:
          type: object
          properties:
            total: { type: integer }
            byStatus:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationStatusCount"
            last7d: { type: integer }
          required: [total, byStatus, last7d]
        members:
          type: object
          properties:
            activeStudents: { type: integer }
            pendingActivation: { type: integer }
            mentors: { type: integer }
          required: [activeStudents, pendingActivation, mentors]
        cohorts:
          type: object
          properties:
            activeCount: { type: integer }
            active:
              type: array
              items:
                $ref: "#/components/schemas/DashboardCohortItem"
          required: [activeCount, active]
        sessions:
          type: object
          properties:
            upcoming:
              type: array
              items:
                $ref: "#/components/schemas/DashboardSessionItem"
            last30dCount: { type: integer }
          required: [upcoming, last30dCount]
        assignments:
          type: object
          properties:
            activeCount: { type: integer }
            pendingReview: { type: integer }
            dueSoon:
              type: array
              items:
                $ref: "#/components/schemas/DashboardAssignmentItem"
          required: [activeCount, pendingReview, dueSoon]
        activity:
          type: object
          properties:
            activeProjects: { type: integer }
            activityRecordsLast30d: { type: integer }
            feedbackLast30d: { type: integer }
            artifactsLast30d: { type: integer }
          required:
            [activeProjects, activityRecordsLast30d, feedbackLast30d, artifactsLast30d]
        announcements:
          type: object
          properties:
            publishedCount: { type: integer }
            recent:
              type: array
              items:
                $ref: "#/components/schemas/DashboardAnnouncementItem"
          required: [publishedCount, recent]
        windowDays:
          type: object
          properties:
            upcoming: { type: integer }
            recent: { type: integer }
          required: [upcoming, recent]
      required:
        - generatedAt
        - applications
        - members
        - cohorts
        - sessions
        - assignments
        - activity
        - announcements
        - windowDays

    UpdateApplicationBody:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        applicationStatus:
          $ref: "#/components/schemas/ApplicationLifecycleStatus"
        adminNote:
          type: string
          nullable: true
          maxLength: 5000

    AdminLoginBody:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
      required: [email, password]

    SessionUser:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role:
          $ref: "#/components/schemas/UserRole"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
        opsRoles:
          type: array
          items:
            $ref: "#/components/schemas/OpsRole"
      required: [id, email, name, role, roles, opsRoles]

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role:
          $ref: "#/components/schemas/UserRole"
        extraRoles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
        opsRoles:
          type: array
          items:
            $ref: "#/components/schemas/OpsRole"
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        assignedCount: { type: integer }
        completedCount: { type: integer }
      required: [id, name, email, role, extraRoles, opsRoles, isActive, createdAt, updatedAt, assignedCount, completedCount]

