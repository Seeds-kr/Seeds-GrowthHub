<!DOCTYPE html>
<html lang="ko">
  <head>
    <!-- 화면이 전부 한국어인데 `lang="en"` 이었다. 스크린리더가 한국어를 영어
         발음으로 읽고, 브라우저가 "이 페이지를 번역할까요?" 를 띄우며, 줄바꿈
         규칙과 글꼴 대체도 영어 기준으로 잡힌다.
         (날짜 입력의 `mm/dd/yyyy` 는 이것과 무관하다 — 그건 문서 언어가 아니라
         브라우저 로케일을 따른다. 실측으로 확인했다.) -->
    <meta charset="UTF-8" />
    <!-- `maximum-scale=1` 을 뺐다. 그게 있으면 폰에서 두 손가락 확대가 막힌다
         — 눈이 나쁜 사람에게는 읽을 방법이 사라지는 것이고(WCAG 1.4.4), 설계가
         약속한 "폰에서 내용 전부 읽힘"과도 어긋난다. 초기 커밋부터 있었고 근거는
         어디에도 없었다. 확대를 막아서 얻는 것은 없다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seeds</title>
    <!-- 파비콘. 32px 에서 "seeds" 워드마크는 읽히지 않으므로 새싹 마크만 쓴다.
         (이전에는 주황색 둥근 사각형 플레이스홀더가 걸려 있었다.) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#178250" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet" />
      <script>
      /* 테마를 첫 페인트 전에 정한다. React 안에서 붙이면 흰 화면이 한 번
         번쩍인 뒤 어두워진다. 규칙은 src/lib/theme.tsx 와 같아야 한다. */
      (function () {
        try {
          var c = localStorage.getItem("seeds-theme");
          var dark = c === "dark" || (c !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
